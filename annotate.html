<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ground-Truth Annotator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0e0e0e; color: #ddd; font-family: monospace; display: flex;
       flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

#topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
          background: #1a1a1a; border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap; }
#topbar h1 { font-size: 15px; color: #fff; }
#imgLabel  { font-size: 13px; color: #fa0; flex: 1; min-width: 120px; }
#progress  { font-size: 12px; color: #888; }

/* Set selector */
#setSelector { display: flex; gap: 4px; }
.set-btn { padding: 4px 10px; border: 1px solid #444; border-radius: 4px;
           background: #222; color: #888; font-family: monospace; font-size: 11px;
           cursor: pointer; }
.set-btn:hover   { background: #2a2a2a; color: #aaa; }
.set-btn.active-set { background: #1a3a5c; color: #4cf; border-color: #4cf; }

#main { display: flex; flex: 1; overflow: hidden; }

#canvasWrap { flex: 1; display: flex; align-items: center; justify-content: center;
              background: #111; overflow: hidden; }
canvas { image-rendering: pixelated; display: block; }

#sidebar { width: 270px; background: #181818; border-left: 1px solid #333;
           display: flex; flex-direction: column; padding: 12px; gap: 8px;
           overflow-y: auto; flex-shrink: 0; }

/* Circle selector tabs */
#circleSelect { display: flex; gap: 6px; }
.circ-tab { flex: 1; padding: 8px 4px; border: 2px solid transparent;
            border-radius: 6px; text-align: center; cursor: pointer;
            font-size: 12px; font-family: monospace; transition: all 0.15s; }
.circ-tab.iris  { background: #0e2233; color: #5ae; border-color: #1a3a5c; }
.circ-tab.iris.active  { background: #1a3a5c; color: #4cf; border-color: #4cf; }
.circ-tab.pupil { background: #2a1a00; color: #ca6; border-color: #5c3a00; }
.circ-tab.pupil.active { background: #5c3a00; color: #fc4; border-color: #fc4; }

.section { background: #222; border-radius: 6px; padding: 10px; }
.section h3 { font-size: 11px; color: #888; text-transform: uppercase;
              letter-spacing: 1px; margin-bottom: 8px; }

#instrBox { font-size: 12px; color: #4f4; line-height: 1.6; white-space: pre-wrap; }
#instrBox.warn { color: #fa0; }

.val { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
.val span:first-child { color: #888; }
.val span:last-child  { color: #cfc; }

.btn { width: 100%; padding: 7px; border: none; border-radius: 5px;
       font-size: 12px; font-family: monospace; cursor: pointer; }
.btn-green  { background: #1a5c1a; color: #8f8; }
.btn-green:hover  { background: #246624; }
.btn-blue   { background: #1a3a5c; color: #88f; }
.btn-blue:hover   { background: #1e4a78; }
.btn-orange { background: #5c3a00; color: #fb8; }
.btn-orange:hover { background: #7a4e00; }
.btn-red    { background: #5c1a1a; color: #f88; }
.btn-red:hover    { background: #7a2222; }
.btn-gray   { background: #333; color: #aaa; }
.btn-gray:hover   { background: #444; }

#algoBox { font-size: 11px; color: #666; line-height: 1.6; white-space: pre; }
#noteBox { width:100%; background:#111; color:#ccc; border:1px solid #444;
           border-radius:4px; padding:5px; font-family:monospace; font-size:11px;
           resize:vertical; height:48px; }

.imglist { display: flex; flex-wrap: wrap; gap: 4px; }
.imgthumb { width: 36px; height: 27px; border: 2px solid #444; border-radius:3px;
            cursor: pointer; object-fit: cover; }
.imgthumb.done   { border-color: #4a4; }
.imgthumb.active { border-color: #fa0; }
.imgthumb.skip   { border-color: #555; opacity:.5; }

#exportWrap { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

#saveStatus { font-size: 10px; color: #4f4; text-align: center; min-height: 14px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>GT Annotator</h1>
  <div id="setSelector">
    <button class="set-btn active-set" id="btn-set-test"   onclick="switchSet('test-images')">Test Images</button>
    <button class="set-btn"            id="btn-set-ubiris" onclick="switchSet('ubiris-check')">UBIRIS v2</button>
  </div>
  <span id="imgLabel">—</span>
  <span id="progress">0 / 0 annotated</span>
</div>

<div id="main">
  <div id="canvasWrap"><canvas id="c"></canvas></div>

  <div id="sidebar">

    <!-- Circle selector -->
    <div id="circleSelect">
      <div class="circ-tab iris active" id="tab-iris"  onclick="selectCircle('iris')">
        🔵 IRIS
      </div>
      <div class="circ-tab pupil" id="tab-pupil" onclick="selectCircle('pupil')">
        🟠 PUPIL
      </div>
    </div>

    <!-- Instructions for active circle -->
    <div class="section">
      <h3>Instructions</h3>
      <div id="instrBox">—</div>
    </div>

    <!-- Active circle values -->
    <div class="section">
      <h3 id="valTitle">Iris values</h3>
      <div class="val"><span>Center</span>     <span id="vCx">—</span></div>
      <div class="val"><span>Radius (px)</span><span id="vR">—</span></div>
      <div style="display:flex;gap:4px;margin-top:6px">
        <button class="btn btn-gray" style="flex:1" onclick="placeNew()">
          Place New</button>
        <button class="btn btn-gray" style="flex:1" onclick="resetToAlgo()">
          From Algo</button>
      </div>
    </div>

    <!-- Other circle values (read-only) -->
    <div class="section" style="opacity:0.55">
      <h3 id="otherTitle">Pupil values</h3>
      <div class="val"><span>Center</span>     <span id="vOtherCx">—</span></div>
      <div class="val"><span>Radius (px)</span><span id="vOtherR">—</span></div>
    </div>

    <!-- Algorithm -->
    <div class="section">
      <h3>Algorithm result</h3>
      <div id="algoBox">—</div>
    </div>

    <!-- Notes -->
    <div class="section">
      <h3>Notes</h3>
      <textarea id="noteBox" placeholder="Optional: occlusion, poor quality…"></textarea>
    </div>

    <!-- Thumbnails -->
    <div class="section">
      <h3>Images</h3>
      <div class="imglist" id="thumbList"></div>
    </div>

    <div id="exportWrap">
      <div id="saveStatus"></div>
      <button class="btn btn-red"   onclick="skipImage()">Skip Image</button>
      <button class="btn btn-green" onclick="saveAndNext()"
              style="font-size:14px;padding:10px">✓ Confirm &amp; Next →</button>
      <button class="btn btn-blue"  style="margin-top:4px" onclick="exportJSON()">
        Export ground-truth.json</button>
      <button class="btn btn-gray"  style="margin-top:2px" onclick="logJSON()">
        Log JSON to Console</button>
    </div>

  </div>
</div>

<script src="/core/iris.js"></script>
<script>
// ── Image Sets ────────────────────────────────────────────────────────────────
var IMAGE_SETS = {
  'test-images': {
    label: 'Test Images',
    dir: '/test-images/',
    files: [
      'Bryan Left Window Reflection.png',
      'Bryan Left.png',
      'Bryan Right Window Reflection.png',
      'Bryan Right.png',
      'Bryan.JPG',
      'Carlie_Right_Iris.jpg',
      'IMG_0496 Blake Right.jpeg',
      'IMG_3091 Jeri Norden.jpg',
      'IMG_3166 Bradley N.jpg',
      'IMG_6410 Illiana Zoom.jpg',
      'IMG_6410 Illiana.jpg',
      'IMG_9119 Rachel Green Zoom.jpg',
      'IMG_9119 Rachel Green.jpg',
      'IMG_9924 Bryan Left.JPG',
      'SBVPI_14_green_f15.jpg',
      'SBVPI_15_brown_f32.jpg',
      'SBVPI_19_blue_m21.jpg',
      'SBVPI_1_brown_m28.jpg',
      'SBVPI_2_blue_f28.jpg',
      'SBVPI_4_grey_f75.jpg',
      'SBVPI_7_green_m45.jpg',
      'SBVPI_9_blue_m75.jpg',
      'Terri 1.jpg'
    ]
  },
  'ubiris-check': {
    label: 'UBIRIS v2',
    dir: '/ubiris-check/',
    files: [
      'C11_S1_I13.jpg','C112_S1_I8.jpg','C122_S1_I7.jpg','C155_S1_I9.jpg',
      'C204_S1_I13.jpg','C223_S1_I6.jpg','C307_S2_I11.jpg','C318_S2_I11.jpg',
      'C326_S2_I7.jpg','C328_S1_I4.jpg','C329_S1_I13.jpg','C334_S1_I7.jpg',
      'C338_S1_I4.jpg','C349_S1_I4.jpg','C379_S1_I13.jpg','C390_S1_I6.jpg',
      'C394_S1_I1.jpg','C465_S1_I5.jpg','C492_S1_I11.jpg','C58_S1_I3.jpg'
    ]
  }
};

// Metadata from gt-data.json (populated at boot)
var gtMeta = {
  _version: 2,
  _note: 'Ground-truth iris ring placements. Keys are \'dir/filename\'. Add entries via annotate.html, then save this file to git.',
  _sets: {
    'test-images': 'Subject photos used for algorithm development and regression testing',
    'ubiris-check': 'UBIRIS v2 close-up iris dataset samples'
  }
};

// ── State ─────────────────────────────────────────────────────────────────────
// gt keys: "setId/filename"  e.g. "test-images/IMG_9924 Bryan Left.JPG"
var gt  = {};
var currentSet = 'test-images';
var idx = 0;
var imgEl      = null;
var SCALE      = 1;
var algoResult = null;

// Circles — completely independent objects
var iris  = { cx: -1, cy: -1, r: -1 };
var pupil = { cx: -1, cy: -1, r: -1 };

// Which circle the user is currently working on
var activeCircle = 'iris';   // 'iris' | 'pupil'

// Drag state — type: 'draw' | 'move' | 'resize'
var drag = null;
var EDGE_TOL_PX = 16;   // display pixels for edge grab zone

// ── Helpers ───────────────────────────────────────────────────────────────────
function getCurrentFiles() { return IMAGE_SETS[currentSet].files; }
function getImgDir()       { return IMAGE_SETS[currentSet].dir; }
function imgKey(file)      { return currentSet + '/' + file; }

// ── Canvas ────────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx    = canvas.getContext('2d');

canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('mouseleave', onUp);

document.addEventListener('keydown', function(e) {
  if (e.key === 'i' || e.key === 'I') selectCircle('iris');
  if (e.key === 'p' || e.key === 'P') selectCircle('pupil');
});

function imgPt(e) {
  var r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE };
}
function dist(ax, ay, bx, by) {
  var dx = bx-ax, dy = by-ay; return Math.sqrt(dx*dx+dy*dy);
}

// ── Active circle accessor ────────────────────────────────────────────────────
function active()  { return activeCircle === 'iris' ? iris  : pupil; }
function inactive(){ return activeCircle === 'iris' ? pupil : iris;  }
function activeColor()   { return activeCircle === 'iris' ? '#3cf' : '#fc4'; }
function inactiveColor() { return activeCircle === 'iris' ? 'rgba(255,196,64,0.45)' : 'rgba(60,200,255,0.45)'; }

// ── Mouse ─────────────────────────────────────────────────────────────────────
function onDown(e) {
  if (e.button !== 0) return;
  var p   = imgPt(e);
  var obj = active();
  var et  = EDGE_TOL_PX / SCALE;

  if (obj.r > 0) {
    var d = dist(p.x, p.y, obj.cx, obj.cy);
    if (Math.abs(d - obj.r) <= et) {
      drag = { type:'resize', startCx: obj.cx, startCy: obj.cy };
      e.preventDefault(); return;
    }
    if (d < obj.r - et) {
      drag = { type:'move', startMx: p.x, startMy: p.y,
               startCx: obj.cx, startCy: obj.cy };
      e.preventDefault(); return;
    }
  }

  // Outside (or no circle yet) — start drawing a new circle from scratch
  obj.cx = p.x; obj.cy = p.y; obj.r = 2;
  drag = { type:'draw', startCx: p.x, startCy: p.y };
  e.preventDefault();
}

function onMove(e) {
  var p   = imgPt(e);
  var obj = active();

  if (drag) {
    if (drag.type === 'move') {
      obj.cx = drag.startCx + (p.x - drag.startMx);
      obj.cy = drag.startCy + (p.y - drag.startMy);
    } else {
      obj.r = Math.max(2, dist(drag.startCx, drag.startCy, p.x, p.y));
    }
    updateUI(); draw(); return;
  }

  if (obj.r > 0) {
    var d  = dist(p.x, p.y, obj.cx, obj.cy);
    var et = EDGE_TOL_PX / SCALE;
    if (Math.abs(d - obj.r) <= et) canvas.style.cursor = 'ew-resize';
    else if (d < obj.r - et)       canvas.style.cursor = 'move';
    else                           canvas.style.cursor = 'crosshair';
  } else {
    canvas.style.cursor = 'crosshair';
  }
  draw();
}

function onUp() { drag = null; }

// ── Drawing ───────────────────────────────────────────────────────────────────
function draw() {
  if (!imgEl) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(imgEl, 0, 0);

  // Algorithm overlay — always dim dashed
  if (algoResult && algoResult.ok) {
    var aCx  = algoResult.cxFrac  * canvas.width;
    var aCy  = algoResult.cyFrac  * canvas.height;
    var aPCx = (algoResult.cxPupilFrac != null ? algoResult.cxPupilFrac : algoResult.cxFrac) * canvas.width;
    var aPCy = (algoResult.cyPupilFrac != null ? algoResult.cyPupilFrac : algoResult.cyFrac) * canvas.height;
    var aRi  = algoResult.rIrisFrac * canvas.width;
    drawCircle(aCx, aCy, aRi,  'rgba(80,80,200,0.35)', 1.5, [5,4]);
    if (algoResult.rPupilFrac)
      drawCircle(aPCx, aPCy, algoResult.rPupilFrac*canvas.width,
                 'rgba(200,120,30,0.35)', 1.5, [5,4]);
  }

  var act = active(), inact = inactive();

  if (inact.r > 0)
    drawCircle(inact.cx, inact.cy, inact.r, inactiveColor(), 0.7 / SCALE);

  if (act.r > 0) {
    drawCircle(act.cx, act.cy, act.r, activeColor(), 1 / SCALE);
    drawCross(act.cx, act.cy, activeColor());
    ['E','W','N','S'].forEach(function(dir) {
      var hx = act.cx + (dir==='E' ? act.r : dir==='W' ? -act.r : 0);
      var hy = act.cy + (dir==='S' ? act.r : dir==='N' ? -act.r : 0);
      drawHandle(hx, hy, activeColor());
    });
  } else if (act.cx >= 0) {
    drawCross(act.cx, act.cy, activeColor());
  }
}

function drawCircle(cx, cy, r, color, lw, dash) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = color; ctx.lineWidth = lw || 2;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.restore();
}
function drawCross(cx, cy, color) {
  var s = 8 / SCALE;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx-s,cy); ctx.lineTo(cx+s,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-s); ctx.lineTo(cx,cy+s); ctx.stroke();
  ctx.restore();
}
function drawHandle(x, y, color) {
  var s = 5 / SCALE;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function selectCircle(which) {
  activeCircle = which;
  document.getElementById('tab-iris').className  = 'circ-tab iris'  + (which==='iris'  ? ' active':'');
  document.getElementById('tab-pupil').className = 'circ-tab pupil' + (which==='pupil' ? ' active':'');
  updateUI(); draw();
}

function placeNew() {
  var obj = active();
  obj.cx = -1; obj.cy = -1; obj.r = -1;
  canvas.style.cursor = 'crosshair';
  updateUI(); draw();
}

function resetToAlgo() {
  if (!algoResult || !algoResult.ok) return;
  var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
  if (activeCircle === 'iris') {
    iris.cx = algoResult.cxFrac * iw;
    iris.cy = algoResult.cyFrac * ih;
    iris.r  = algoResult.rIrisFrac * iw;
  } else {
    pupil.cx = (algoResult.cxPupilFrac != null ? algoResult.cxPupilFrac : algoResult.cxFrac) * iw;
    pupil.cy = (algoResult.cyPupilFrac != null ? algoResult.cyPupilFrac : algoResult.cyFrac) * ih;
    pupil.r  = algoResult.rPupilFrac ? algoResult.rPupilFrac * iw : iris.r * 0.35;
  }
  updateUI(); draw();
}

function updateUI() {
  var box = document.getElementById('instrBox');
  var label = activeCircle === 'iris' ? 'IRIS' : 'PUPIL';
  box.className = '';
  box.textContent =
    'Working on: ' + label + '\n\n' +
    'Drag outside  → draw new circle\nDrag interior → move\nDrag edge     → resize\n\n' +
    'Switch:  I = iris   P = pupil';

  var act   = active();
  var inact = inactive();
  var iw    = imgEl ? imgEl.naturalWidth : 1;

  document.getElementById('valTitle').textContent   = activeCircle === 'iris' ? 'Iris values' : 'Pupil values';
  document.getElementById('otherTitle').textContent = activeCircle === 'iris' ? 'Pupil values (inactive)' : 'Iris values (inactive)';

  document.getElementById('vCx').textContent =
    act.cx >= 0 ? Math.round(act.cx)+', '+Math.round(act.cy) : '—';
  document.getElementById('vR').textContent =
    act.r  > 0  ? Math.round(act.r)+'  ('+( act.r/iw).toFixed(3)+')' : '—';

  document.getElementById('vOtherCx').textContent =
    inact.cx >= 0 ? Math.round(inact.cx)+', '+Math.round(inact.cy) : '—';
  document.getElementById('vOtherR').textContent =
    inact.r  > 0  ? Math.round(inact.r)+'  ('+(inact.r/iw).toFixed(3)+')' : '—';
}

function showAlgo() {
  var box = document.getElementById('algoBox');
  if (!algoResult) { box.textContent = 'n/a'; return; }
  var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
  box.textContent =
    'ok: ' + algoResult.ok + '\n' +
    'cx: ' + (algoResult.cxFrac*iw).toFixed(1) +
    '  cy: ' + (algoResult.cyFrac*ih).toFixed(1) + '\n' +
    'irisR: ' + (algoResult.rIrisFrac*iw).toFixed(1) + '\n' +
    'pupilR: ' + (algoResult.rPupilFrac ? (algoResult.rPupilFrac*iw).toFixed(1) : '—');
}

// ── Load image ────────────────────────────────────────────────────────────────
function loadImage(i) {
  idx = i;
  drag = null;
  var files = getCurrentFiles();
  var file  = files[i];
  var key   = imgKey(file);

  document.getElementById('imgLabel').textContent =
    currentSet + '/' + file + '  (' + (i+1) + '/' + files.length + ')';

  imgEl = new Image();
  imgEl.onload = function() {
    var wrapEl = document.getElementById('canvasWrap');
    var maxW = wrapEl.clientWidth  - 20;
    var maxH = wrapEl.clientHeight - 20;
    SCALE = Math.min(maxW / imgEl.naturalWidth, maxH / imgEl.naturalHeight);
    canvas.style.width  = Math.round(imgEl.naturalWidth  * SCALE) + 'px';
    canvas.style.height = Math.round(imgEl.naturalHeight * SCALE) + 'px';
    canvas.width  = imgEl.naturalWidth;
    canvas.height = imgEl.naturalHeight;

    algoResult = autoFit(imgEl, true);
    showAlgo();

    if (gt[key] && !gt[key]._skip) {
      // Restore saved annotation
      iris  = { cx: gt[key].irisCx,  cy: gt[key].irisCy,  r: gt[key].irisR  };
      pupil = { cx: gt[key].pupilCx, cy: gt[key].pupilCy, r: gt[key].pupilR };
    } else {
      // Auto-fill from algorithm
      var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
      if (algoResult && algoResult.ok) {
        iris  = { cx: algoResult.cxFrac*iw, cy: algoResult.cyFrac*ih,
                  r:  algoResult.rIrisFrac*iw };
        pupil = { cx: (algoResult.cxPupilFrac != null ? algoResult.cxPupilFrac : algoResult.cxFrac)*iw,
                  cy: (algoResult.cyPupilFrac != null ? algoResult.cyPupilFrac : algoResult.cyFrac)*ih,
                  r:  algoResult.rPupilFrac ? algoResult.rPupilFrac*iw : iris.r*0.35 };
      } else {
        iris  = { cx: -1, cy: -1, r: -1 };
        pupil = { cx: -1, cy: -1, r: -1 };
      }
    }

    // Restore note
    document.getElementById('noteBox').value = (gt[key] && gt[key].note) ? gt[key].note : '';

    updateUI(); draw();
    updateThumbs(); updateProgress();
  };
  imgEl.onerror = function() {
    document.getElementById('instrBox').textContent = 'Failed to load image: ' + file;
  };
  imgEl.src = getImgDir() + file;
}

// ── Save / navigation ─────────────────────────────────────────────────────────
function saveAndNext() {
  if (iris.r <= 0) { alert('Iris circle not placed yet. Place it or click Skip.'); return; }
  if (pupil.r <= 0) pupil.r = iris.r * 0.35;

  var files = getCurrentFiles();
  var file  = files[idx];
  var key   = imgKey(file);
  var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;

  gt[key] = {
    set:     currentSet,
    file:    file,
    imgW:    iw, imgH: ih,
    irisCx:  Math.round(iris.cx),  irisCy:  Math.round(iris.cy),  irisR:  Math.round(iris.r),
    pupilCx: Math.round(pupil.cx), pupilCy: Math.round(pupil.cy), pupilR: Math.round(pupil.r),
    // Fractional values for resolution-independent use
    irisCxFrac:  iris.cx / iw,   irisCyFrac:  iris.cy / ih,   irisRFrac:  iris.r / iw,
    pupilCxFrac: pupil.cx / iw,  pupilCyFrac: pupil.cy / ih,  pupilRFrac: pupil.r / iw,
    note:    document.getElementById('noteBox').value,
    ts:      new Date().toISOString()
  };

  persistGT();
  document.getElementById('noteBox').value = '';
  updateThumbs(); updateProgress();

  // Auto-export JSON (safety net — data never lost)
  autoExportJSON();

  var next = idx + 1;
  while (next < files.length && gt[imgKey(files[next])] && gt[imgKey(files[next])]._skip) next++;
  if (next < files.length) loadImage(next);
  else alert('All images in this set done!');
}

function skipImage() {
  var files = getCurrentFiles();
  var key   = imgKey(files[idx]);
  gt[key] = { _skip: true };
  persistGT();
  updateThumbs(); updateProgress();
  if (idx + 1 < files.length) loadImage(idx + 1);
}

// ── Persist to localStorage ───────────────────────────────────────────────────
function persistGT() {
  try { localStorage.setItem('aeye_gt', JSON.stringify(gt)); } catch(e) {}
}

// ── Export helpers ────────────────────────────────────────────────────────────
function buildExportObj() {
  // Build gt-data.json compatible object
  var out = {
    _version:  gtMeta._version,
    _note:     gtMeta._note,
    _sets:     gtMeta._sets,
    _updated:  new Date().toISOString()
  };
  for (var k in gt) {
    if (!gt[k]._skip) out[k] = gt[k];
  }
  return out;
}

function autoExportJSON() {
  // Trigger download (browser allows this inside a click handler)
  var json = JSON.stringify(buildExportObj(), null, 2);
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    a.download = 'gt-data.json';
    a.click();
  } catch(e) {}
  // Also log so Claude can capture via browser JS tool
  console.log('[GT-EXPORT]', json);
  // Show status
  var s = document.getElementById('saveStatus');
  s.textContent = '✓ Saved & downloaded gt-data.json';
  setTimeout(function(){ s.textContent = ''; }, 3000);
}

function exportJSON() {
  autoExportJSON();
}

function logJSON() {
  var json = JSON.stringify(buildExportObj(), null, 2);
  console.log('[GT-EXPORT]', json);
  alert('JSON logged to console. Open DevTools → Console to copy it.');
}

// ── Set switcher ──────────────────────────────────────────────────────────────
function switchSet(setId) {
  if (setId === currentSet) return;
  currentSet = setId;
  document.getElementById('btn-set-test').className =
    'set-btn' + (setId === 'test-images'   ? ' active-set' : '');
  document.getElementById('btn-set-ubiris').className =
    'set-btn' + (setId === 'ubiris-check'  ? ' active-set' : '');
  buildThumbs();
  var files = getCurrentFiles();
  var start = 0;
  while (start < files.length - 1 && gt[imgKey(files[start])] && !gt[imgKey(files[start])]._skip) start++;
  loadImage(start);
}

// ── Thumbnails ────────────────────────────────────────────────────────────────
function buildThumbs() {
  var list  = document.getElementById('thumbList');
  list.innerHTML = '';
  var files = getCurrentFiles();
  files.forEach(function(file, i) {
    var img = document.createElement('img');
    img.src = getImgDir() + file;
    img.className = 'imgthumb'; img.title = file;
    img.onclick = (function(ii){ return function(){ loadImage(ii); }; })(i);
    list.appendChild(img);
  });
}

function updateThumbs() {
  var thumbs = document.getElementById('thumbList').querySelectorAll('img');
  var files  = getCurrentFiles();
  files.forEach(function(file, i) {
    var key = imgKey(file);
    thumbs[i].className = 'imgthumb' +
      (i === idx                       ? ' active' : '') +
      (gt[key] && !gt[key]._skip       ? ' done'   : '') +
      (gt[key] &&  gt[key]._skip       ? ' skip'   : '');
  });
}

function updateProgress() {
  var files = getCurrentFiles();
  var done  = 0;
  files.forEach(function(file){ var k = imgKey(file); if (gt[k] && !gt[k]._skip) done++; });
  document.getElementById('progress').textContent = done + ' / ' + files.length + ' annotated';
}

// ── Data merge ────────────────────────────────────────────────────────────────
function mergeFromFetch(data) {
  // Metadata
  if (data._version) gtMeta._version = data._version;
  if (data._note)    gtMeta._note    = data._note;
  if (data._sets)    gtMeta._sets    = data._sets;
  // Annotations — localStorage wins (it may have newer edits)
  for (var k in data) {
    if (k.startsWith('_')) continue;
    if (!gt[k]) gt[k] = data[k];
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
// 1. Load localStorage
try { gt = JSON.parse(localStorage.getItem('aeye_gt') || '{}'); } catch(e) { gt = {}; }

// 2. Fetch committed gt-data.json and merge
fetch('ground-truth/gt-data.json')
  .then(function(r){ return r.json(); })
  .then(function(data) {
    mergeFromFetch(data);
    persistGT();
    console.log('[GT-BOOT] Loaded', Object.keys(data).filter(function(k){return !k.startsWith('_');}).length,
                'entries from gt-data.json');
  })
  .catch(function(e){ console.warn('[GT-BOOT] Could not fetch gt-data.json:', e.message); })
  .finally(function() {
    buildThumbs();
    updateProgress();
    var files = getCurrentFiles();
    var start = 0;
    while (start < files.length - 1 && gt[imgKey(files[start])] && !gt[imgKey(files[start])]._skip) start++;
    loadImage(start);
  });
</script>
</body>
</html>
